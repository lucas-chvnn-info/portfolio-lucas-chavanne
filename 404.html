<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Lucas Chavanne</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23C51A4A'/%3E%3C/svg%3E">
<script>
/* Thème enregistré, comme sur le site */
try{var t=localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/assets/fonts/archivo-latin-wdth-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
:root{--paper:#EEF1F4;--ink:#000;--ink-soft:#4A5866;--raspberry:#C51A4A;--focus:#1D5FD1;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111112;--ink:#EDEDED;--ink-soft:#A1A1A6;--raspberry:#F0507A;--focus:#7FB0FF;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111112;--ink:#EDEDED;--ink-soft:#A1A1A6;--raspberry:#F0507A;--focus:#7FB0FF;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
main{width:min(34rem,100%)}
.code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;color:var(--raspberry);display:flex;align-items:center;gap:.6rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--raspberry)}
h1{margin:.75rem 0 1rem;font-size:clamp(2.4rem,9vw,4rem);line-height:1;font-weight:800;font-variation-settings:"wdth" 125;letter-spacing:-.02em}
p{margin:0 0 2rem;color:var(--ink-soft)}
p.en{margin:2rem 0 0;font-size:.95rem}
a.plain{display:inline;padding:0;border:0;background:none;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
a.plain:hover{background:none;color:var(--raspberry)}
a{display:inline-flex;padding:.8rem 1.25rem;border-radius:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none;transition:background-color .15s ease,border-color .15s ease}
a:hover{background:var(--raspberry);border-color:var(--raspberry)}
a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code"><span class="dot" aria-hidden="true"></span>404</div>
  <h1>Page introuvable</h1>
  <p>Cette adresse ne correspond à rien sur ce site. Elle a peut-être changé, ou contient une faute de frappe.</p>
  <a href="/">Retour à l'accueil</a>
  <p class="en" lang="en">Page not found. This address doesn't match anything on this site. <a class="plain" href="/en/">Back to the English site</a></p>
</main>
</body>
</html>
